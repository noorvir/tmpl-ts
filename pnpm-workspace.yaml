packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: false
  # @module db
  "@prisma/engines": true
  prisma: true
  # @end-module
  # @module chrome
  "@parcel/watcher": false
  # @end-module
  # @module desktop
  electron: true
  electron-winstaller: false
  # @end-module

# pnpm wrote this list. These pinned versions are newer than its minimum release age.
minimumReleaseAgeExclude:
  # @module auth
  - "@better-auth/core@1.7.15"
  - "@better-auth/drizzle-adapter@1.7.15"
  - "@better-auth/kysely-adapter@1.7.15"
  - "@better-auth/memory-adapter@1.7.15"
  - "@better-auth/mongo-adapter@1.7.15"
  - "@better-auth/prisma-adapter@1.7.15"
  - "@better-auth/telemetry@1.7.15"
  - better-auth@1.7.15
  # @end-module
  # @module ui
  - "@hookform/resolvers@7.0.1"
  - react-resizable-panels@4.16.0
  # @end-module
  # @module web|desktop|clients
  - "@tanstack/query-core@5.105.1"
  - "@tanstack/react-query@5.105.1"
  # @end-module
  # @module api
  - hono@4.13.16
  # @end-module

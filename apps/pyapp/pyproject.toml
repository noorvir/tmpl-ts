[project]
name = "pyapp"
version = "0.1.0"
description = "Python app with FastAPI and Marimo notebooks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.127.1",
    "marimo>=0.18.4",
    "uvicorn>=0.40.0",
    "langgraph>=0.4.0",
    "langchain-anthropic>=0.3.0",
]

[dependency-groups]
dev = ["ruff>=0.8.0", "pytest>=8.0.0", "httpx>=0.27.0"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (run with -m slow)"]
